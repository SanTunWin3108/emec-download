<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Theme Download Portal</title>
    <!-- Anime theme အတွက် Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
    <style>
        * {
            box-sizing: border-box;
            transition: background 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Theme Switcher Panel --- */
        #theme-switcher {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            display: flex;
            justify-content: center;
            gap: 12px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        #theme-switcher button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-family: sans-serif;
        }
        .sw-btn-hacker { background: #030a03; color: #00FF41; border: 1px solid #00FF41; }
        .sw-btn-cyberpunk { background: #0a0a14; color: #00ffcc; border: 1px solid #ff007f; }
        .sw-btn-anime { background: #fff0f3; color: #ff6b81; border: 1px solid #ffdde1; }

        /* --- Layout Container --- */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-top: 70px;
            padding-bottom: 30px;
            z-index: 10;
        }
        .container {
            width: 100%;
            max-width: 850px;
            padding: 20px;
        }
        .page {
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }
        .active-page {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ul { list-style-type: none; padding: 0; margin: 20px 0; }
        li { margin: 15px 0; padding: 10px; }
        a { text-decoration: none; display: block; width: 100%; }

        /* --- Carousel Styles --- */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            overflow: hidden;
        }
        .carousel-slide {
            display: none;
            width: 100%;
            height: auto;
        }
        .carousel-slide.active {
            display: block;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 18px;
            z-index: 20;
            border-radius: 50%;
        }
        .carousel-btn.prev { left: 15px; }
        .carousel-btn.next { right: 15px; }
        .carousel-btn:hover { background: rgba(0, 0, 0, 0.8); }

        /* =========================================
           THEME 1: HACKER
           ========================================= */
        body.theme-hacker {
            font-family: 'Courier New', Courier, monospace;
            background-color: #020802;
            background-image: 
                radial-gradient(rgba(0, 255, 65, 0.15) 1px, transparent 0),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 24px 24px, 100% 4px;
            color: #00FF41;
        }
        .theme-hacker .page {
            background: rgba(2, 12, 2, 0.92);
            border: 1px solid #00FF41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3), inset 0 0 10px rgba(0, 255, 65, 0.15);
            border-radius: 4px;
            padding: 40px 30px;
        }
        .theme-hacker h1 {
            color: #00FF41;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
            text-transform: uppercase;
        }
        .theme-hacker h1::before { content: "> "; }
        .theme-hacker .carousel-slide {
            border: 2px solid #00FF41;
            filter: sepia(100%) hue-rotate(60deg) saturate(300%) contrast(120%);
        }
        .theme-hacker button.action-btn {
            background: #030a03;
            color: #00FF41;
            border: 1px solid #00FF41;
            font-family: inherit;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.3);
            margin-top: 10px;
            cursor: pointer;
        }
        .theme-hacker button.action-btn:hover {
            background: #00FF41;
            color: #030a03;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.9);
        }
        .theme-hacker li {
            border-left: 3px solid #00FF41;
            background: rgba(0, 255, 65, 0.03);
            text-align: left;
        }
        .theme-hacker a {
            color: #00FF41;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
        }
        .theme-hacker a:hover { color: #ffffff; text-shadow: 0 0 10px #00FF41; }

        /* =========================================
           THEME 2: CYBERPUNK
           ========================================= */
        body.theme-cyberpunk {
            font-family: sans-serif;
            background-color: #050510;
            background-image: 
                linear-gradient(rgba(255, 0, 127, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.15) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.1), rgba(5, 5, 16, 0.95));
            background-size: 40px 40px, 40px 40px, 100% 100%;
            color: #00ffcc;
        }
        .theme-cyberpunk .page {
            background: rgba(10, 10, 25, 0.9);
            border: 2px solid #00ffcc;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            padding: 40px 30px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.35);
        }
        .theme-cyberpunk h1 {
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.8);
        }
        .theme-cyberpunk .carousel-slide {
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            border-radius: 6px;
        }
        .theme-cyberpunk button.action-btn {
            background: #ff007f;
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            margin-top: 10px;
            cursor: pointer;
        }
        .theme-cyberpunk button.action-btn:hover {
            background: #00ffcc;
            color: #05050a;
            box-shadow: 0 0 25px #00ffcc;
            transform: translateY(-2px);
        }
        .theme-cyberpunk li {
            background: rgba(0, 255, 204, 0.05);
            border: 1px dashed #00ffcc;
        }
        .theme-cyberpunk li:hover { background: rgba(255, 0, 127, 0.15); border-color: #ff007f; }
        .theme-cyberpunk a { color: #00ffcc; font-weight: bold; text-shadow: 0 0 5px rgba(0, 255, 204, 0.5); }
        .theme-cyberpunk a:hover { color: #ff007f; text-shadow: 0 0 8px rgba(255, 0, 127, 0.8); }

        /* =========================================
           THEME 3: ANIME
           ========================================= */
        body.theme-anime {
            font-family: 'Fredoka', sans-serif;
            background-color: #ffdde1;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.6) 15%, transparent 16%),
                radial-gradient(rgba(255, 182, 193, 0.5) 15%, transparent 16%),
                linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #a1c4fd 100%);
            background-size: 60px 60px, 60px 60px, 100% 100%;
            background-position: 0 0, 30px 30px, 0 0;
            color: #5a4b5c;
        }
        .theme-anime .page {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            border: 4px solid #fff;
            border-radius: 28px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(238, 156, 167, 0.4);
        }
        .theme-anime h1 {
            color: #ff6b81;
            font-size: 32px;
            text-shadow: 2px 2px 0px #ffffff;
        }
        .theme-anime .carousel-slide {
            border: 5px solid #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 107, 129, 0.3);
        }
        .theme-anime button.action-btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 6px 18px rgba(255, 117, 140, 0.4);
            margin-top: 15px;
            cursor: pointer;
        }
        .theme-anime button.action-btn:hover {
            background: linear-gradient(135deg, #ff4e50 0%, #f9d423 100%);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 25px rgba(255, 78, 80, 0.5);
        }
        .theme-anime li {
            background: #ffffff;
            border: 2px solid #ffeaa7;
            border-radius: 18px;
        }
        .theme-anime li:hover { border-color: #ff758c; transform: translateX(6px); background: #fff0f3; }
        .theme-anime a { color: #6c5ce7; font-weight: 600; font-size: 18px; }
        .theme-anime a:hover { color: #ff6b81; }

    </style>
</head>
<body class="theme-hacker">

    <!-- Theme Switcher Panel -->
    <div id="theme-switcher">
        <button class="sw-btn-hacker" onclick="setTheme('hacker')">Hacker</button>
        <button class="sw-btn-cyberpunk" onclick="setTheme('cyberpunk')">Cyberpunk</button>
        <button class="sw-btn-anime" onclick="setTheme('anime')">Anime</button>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="container">
            <!-- Page 1: Welcome with Image Carousel -->
            <div id="page1" class="page active-page">
                <h1 id="welcome-title">Welcome To EMEC</h1>
                
                <!-- Carousel Container (ဓာတ်ပုံမည်မျှမဆို ထပ်ထည့်နိုင်ပါသည်) -->
                <div class="carousel-container">
                    <img src="img1.jpg" class="carousel-slide active" alt="Photo 1">
                    <img src="img (1).jpg" class="carousel-slide" alt="Photo 2">
                    <img src="img (2).jpg" class="carousel-slide" alt="Photo 3">
                    <img src="img (3).jpg" class="carousel-slide" alt="Photo 4">
                    <img src="img (4).jpg" class="carousel-slide" alt="Photo 5">
                    <img src="img (5).jpg" class="carousel-slide" alt="Photo 6">
                    <img src="img (6).jpg" class="carousel-slide" alt="Photo 7">
               

                    
                    <button class="carousel-btn prev" onclick="moveSlide(-1)">❮</button>
                    <button class="carousel-btn next" onclick="moveSlide(1)">❯</button>
                </div>

                <br>
                <button class="action-btn" onclick="showPage('page2')" id="btn-view">ဖိုင်များကြည့်ရန်</button>
            </div>

            <!-- Page 2: Downloads -->
            <div id="page2" class="page">
                <h1 id="download-title">Download ဖိုင်များ</h1>
                <ul id="file-list">
                    <li><a href="https://drive.google.com/uc?export=download&id=1u4q6Zhq8s_jEGP4doHQnd4qtkEBTM9L5" target="_blank" class="file-link">Death Note image</a></li>
                    <li><a href="https://drive.google.com/uc?export=download&id=1uOVzw2QhpFT0qbezYEBYX6bwx1YqelQ4" target="_blank" class="file-link">Spark Plug image</a></li>
                    <li><a href="https://drive.google.com/uc?export=download&id=112Pf55K6kBVJSEEnIlbrlM8F-yB_Z8ow" target="_blank" class="file-link">Win RAR software</a></li>
                </ul>
                <br>
                <button class="action-btn" onclick="showPage('page1')" id="btn-back">ပင်မစာမျက်နှာသို့ပြန်သွားရန်</button>
            </div>
        </div>
    </div>

    <script>
        // Page Navigation
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active-page');
            });
            document.getElementById(pageId).classList.add('active-page');
        }

        // Image Carousel Logic
        let currentSlideIndex = 0;
        function moveSlide(n) {
            const slides = document.querySelectorAll('.carousel-slide');
            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex = (currentSlideIndex + n + slides.length) % slides.length;
            slides[currentSlideIndex].classList.add('active');
        }

        // Theme Switching
        function setTheme(themeName) {
            document.body.classList.remove('theme-hacker', 'theme-cyberpunk', 'theme-anime');
            document.body.classList.add('theme-' + themeName);
            updateContentForTheme(themeName);
        }

        // Update Text Content Per Theme
        function updateContentForTheme(theme) {
            const welcomeTitle = document.getElementById('welcome-title');
            const downloadTitle = document.getElementById('download-title');

            if (theme === 'hacker') {
                welcomeTitle.innerText = "Welcome To EMEC";
                downloadTitle.innerText = "Download ဖိုင်များ";
                
            } else if (theme === 'cyberpunk') {
                welcomeTitle.innerText = "Welcome To EMEC";
                downloadTitle.innerText = "Download ဖိုင်များ";
               
            } else if (theme === 'anime') {
                welcomeTitle.innerText = "✨ Welcome To EMEC ✨";
                downloadTitle.innerText = "🎀 Download ဖိုင်များ 🎀";
            }
        }
        
        // Initial setup
        updateContentForTheme('hacker');
    </script>

</body>
</html>
